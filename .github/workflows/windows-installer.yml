name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/windows-installer.yml"
      - "apps/api/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/build-windows-api.ps1"
      - "scripts/build-windows-installer.ps1"
      - "scripts/sign-windows-executable.ps1"
      - "scripts/stage-windows-resources.ps1"
      - "scripts/test-packaged-windows-app.ps1"
      - "scripts/test-windows-installer-install.ps1"
      - "scripts/test-windows-runtime.ps1"
      - "scripts/verify-windows-installer.ps1"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'pull_request' && 'windows-installer-ci' || 'windows-signing' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_MODE: demo
      NEXT_PUBLIC_API_URL: /api/edgeos
      NEXT_PUBLIC_DESKTOP_BUILD: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed." }
          Push-Location apps/api
          try {
            uv sync --all-groups --locked
            if ($LASTEXITCODE -ne 0) { throw "uv sync failed." }
          } finally {
            Pop-Location
          }

      - name: Run Windows payload unit checks
        shell: pwsh
        run: |
          npm run lint --workspace=@edgeos/web
          if ($LASTEXITCODE -ne 0) { throw "Web lint failed." }
          npm run typecheck --workspace=@edgeos/web
          if ($LASTEXITCODE -ne 0) { throw "Web typecheck failed." }
          npm run test --workspace=@edgeos/web
          if ($LASTEXITCODE -ne 0) { throw "Web unit tests failed." }
          Push-Location apps/api
          try {
            uv run --locked ruff check .
            if ($LASTEXITCODE -ne 0) { throw "API lint failed." }
            uv run --locked mypy edgeos
            if ($LASTEXITCODE -ne 0) { throw "API typecheck failed." }
            uv run --locked pytest
            if ($LASTEXITCODE -ne 0) { throw "API tests failed." }
          } finally {
            Pop-Location
          }

      - name: Build and smoke-test Windows payload
        shell: pwsh
        run: |
          & ./scripts/build-windows-installer.ps1 -SkipDependencyInstall -PayloadOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows payload build failed." }

      - name: Package and verify unsigned pull-request installer
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          & ./scripts/build-windows-installer.ps1 -SkipDependencyInstall -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed." }
          "EDGEOS_WINDOWS_ARTIFACT_NAME=edgeos-windows-installer-UNSIGNED-DEV-${{ github.run_number }}-${{ github.run_attempt }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release provenance
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          EDGEOS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EDGEOS_IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          EDGEOS_IS_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $isVersionTag = $env:EDGEOS_IS_VERSION_TAG -eq "true"
          $isManual = $env:EDGEOS_IS_MANUAL -eq "true"
          $defaultBranch = $env:EDGEOS_DEFAULT_BRANCH
          if ([string]::IsNullOrWhiteSpace($defaultBranch)) {
            throw "The repository default branch was not supplied by GitHub Actions."
          }
          if ($isManual -and $env:GITHUB_REF -ne "refs/heads/$defaultBranch") {
            throw "Manual installer builds are restricted to the default branch."
          }
          if ($isVersionTag) {
            & git merge-base --is-ancestor $env:GITHUB_SHA "origin/$defaultBranch"
            if ($LASTEXITCODE -ne 0) { throw "Release tag commit is not contained in the default branch." }
            $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $packageVersion) {
              throw "Release tag version '$tagVersion' does not match desktop package version '$packageVersion'."
            }
          }

      # These names must exist only as protected windows-signing environment
      # secrets/variables. Never duplicate them at repository or organization scope.
      - name: Build and verify release installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD must be configured together."
          }
          $isVersionTag = $env:GITHUB_REF.StartsWith("refs/tags/v", [System.StringComparison]::Ordinal)
          if ($isVersionTag -and -not $hasCertificate) {
            throw "Version-tag releases fail closed without WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD."
          }
          if ($hasCertificate -and [string]::IsNullOrWhiteSpace($env:WINDOWS_EXPECTED_SIGNER_THUMBPRINT)) {
            throw "Signed CI builds require the protected-environment variable WINDOWS_SIGNER_THUMBPRINT."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "edgeos-signing.pfx"
          try {
            $buildParameters = @{
              SkipDependencyInstall = $true
              PackageOnly = $true
            }
            if ($hasCertificate) {
              try {
                $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              } catch {
                throw "WINDOWS_CERTIFICATE_BASE64 is not valid base64."
              }
              [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
              $env:CSC_LINK = $certificatePath
              $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
              $buildParameters.RequireSignature = $true
              "EDGEOS_WINDOWS_ARTIFACT_NAME=edgeos-windows-installer-SIGNED-${{ github.run_number }}-${{ github.run_attempt }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
              # A protected signer pin may exist even when a manual development
              # build deliberately has no certificate. Do not misclassify that
              # unsigned build as a failed signed release.
              $env:WINDOWS_EXPECTED_SIGNER_THUMBPRINT = $null
              "EDGEOS_WINDOWS_ARTIFACT_NAME=edgeos-windows-installer-UNSIGNED-DEV-${{ github.run_number }}-${{ github.run_attempt }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }

            & ./scripts/build-windows-installer.ps1 @buildParameters
            if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed." }
          } finally {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Inventory release artifacts
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/windows -File)
          if ($files.Count -lt 3) { throw "Expected installer, build manifest, and checksums." }
          $files | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.EDGEOS_WINDOWS_ARTIFACT_NAME }}
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30
