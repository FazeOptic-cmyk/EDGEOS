[project]
name = "edgeos-api"
version = "0.1.0"
description = "Read-only sports-market research and paper-trading API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "PyJWT[crypto]==2.10.1",
  "psycopg[binary]==3.2.12",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pyinstaller==6.22.3",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgeos"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["edgeos"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

